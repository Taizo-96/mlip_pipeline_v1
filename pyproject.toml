[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlip-pipeline"
version = "0.1.0"
description = "Active-learning pipeline for MLIP-3 MTP fitting with LAMMPS exploration and VASP labelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Config & CLI
    "PyYAML>=6.0",
    "typer>=0.9",
    # Array I/O for DeePMD→CFG conversion and evaluation
    "numpy>=1.24",
    # Rich terminal output (optional but strongly recommended)
    "rich>=13.0",
    # Materials Project API (download-structures command)
    "mp-api>=0.41",
    # HTTP used by mp-api internally
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
mlip-pipeline = "mlip_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
