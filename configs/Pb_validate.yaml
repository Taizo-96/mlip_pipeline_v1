# ═══════════════════════════════════════════════════════════════════════════
# Pb_validate.yaml  –  Standalone physics validation config for Pb MTP
# ═══════════════════════════════════════════════════════════════════════════

project_root: "/home/saitto/mlip_pipeline_v1"

element: "Pb"

lammps_command: "/home/saitto/active-learning-ML-potential-KTH/codes/interface-lammps-mlip-3/lmp_mpi"
mpi_command:    "mpirun"
mpi_np:         4


# ── Equation of State ──────────────────────────────────────────────────────
eos:
  enabled:    true
  scale_min:  0.80
  scale_max:  1.20
  n_points:   25

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Elastic constants ───────────────────────────────────────────────────────
elastic:
  enabled:    true
  delta:      0.005

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Melting temperature (two-phase coexistence) ─────────────────────────────
# Pb experimental T_melt = 600.61 K.
# Protocol: NxNx2N supercell, bottom half = solid, top half heated to 2*T
# then full cell NPT at T_target.  Volume slope classifies phase stability.
# Bracket search converges to within T_step K of the true T_melt.
melting:
  enabled:          true
  T_start:          450.0   # K  – start of bracket scan (well below T_melt)
  T_end:            750.0   # K  – end of bracket scan (well above T_melt)
  T_step:           50.0    # K  – temperature increment between candidates
  supercell_repeat: 4       # replicate unit cell N x N x 2N (4x4x8 = 128 atoms)
  n_equil:          5000    # steps to create liquid seed (NVT ramp)
  n_prod:           20000   # steps for NPT production (volume trend analysis)
  dt:               0.002   # ps  (2 fs timestep)

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Thermal expansion coefficient (NPT MD) ──────────────────────────────────
# Pb experimental linear α ≈ 29×10⁻⁶ K⁻¹ at 300 K.
# Runs NPT MD at each temperature, records mean V/atom, fits linear slope:
#   α = (1/V_ref) * dV/dT / 3   (volumetric → linear conversion)
thermal_expansion:
  enabled:      true
  temperatures: [100.0, 200.0, 300.0, 400.0, 500.0]  # K
  T_ref:        300.0   # K  – reference temperature for α definition
  n_equil:      5000    # equilibration steps at each T
  n_prod:       10000   # production steps (volume averaged at end)
  dt:           0.002   # ps

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Vacancy formation energy ─────────────────────────────────────────────────
# Pb experimental E_vac ≈ 0.57 eV.
# Method: E_vac = E(N-1) - (N-1)/N * E(N) after minimisation of both cells.
# supercell_repeat=3 → 3×3×3 = 108 atoms (perfect), 107 atoms (vacancy).
vacancy:
  enabled:          true
  supercell_repeat: 3     # N×N×N supercell (~108 atoms for fcc Pb)

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Radial distribution function (NVT MD) ────────────────────────────────────
# Structural fingerprint at 300 K.  Validates first NN distance vs experiment.
# Pb FCC: r₁ ≈ 3.49 Å  (a/√2, a ≈ 4.95 Å).
rdf:
  enabled:          true
  temperature:      300.0  # K
  r_max:            8.0    # Å  – cutoff for g(r) accumulation
  n_bins:           200
  n_equil:          5000
  n_prod:           20000
  dt:               0.002  # ps
  supercell_repeat: 3      # 3×3×3 → sufficient statistics for g(r)

  structures:
    - id:          fcc
      lammps_data: structures/lammps_data/mp-20483.data


# ── Materials Project reference ─────────────────────────────────────────────
# Fetches DFT-computed V0, B0, Cij for the given mp_id and prints a
# deviation table comparing MTP vs DFT at the end of validation.
# Includes T_melt, E_vac, and α where available.
# API key is read from the environment variable named in api_key_env.
# The result is cached to validate_dir/mp_reference.json after first fetch.
reference:
  mp_id:       "mp-20483"   # Pb FCC conventional cell
  api_key_env: "MP_API_KEY" # name of the env var holding your MP API key
