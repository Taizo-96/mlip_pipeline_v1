# ═══════════════════════════════════════════════════════════════════════════
# Pb_validate.yaml  –  Standalone physics validation config for Pb MTP
#
# Usage:
#   python scripts/run_validation.py \
#       --model  runs/gen_05/Pb16.almtp \
#       --config configs/Pb_validate.yaml \
#       --outdir runs/gen_05/validate
#
# This file can also be embedded inside Pb_loop.yaml as a top-level
# "validate:" section so the loop runner can call validation automatically.
#
# Pb reference data (experimental / DFT):
#   Structure:  FCC  (Fm-3m, mp-20483)
#   a0:         4.951 Å  (experimental 300 K)
#   B0:         ~43 GPa  (experimental)
#   C11:        ~49 GPa  |  C12:  ~42 GPa  |  C44:  ~15 GPa
#   Tm:         600.65 K (melting point — relevant for explore temperatures)
# ═══════════════════════════════════════════════════════════════════════════

project_root: "/home/saitto/mlip_pipeline_v1"

# Primary element — passed as species label in pair_coeff
element: "Pb"

# LAMMPS binary (same as Pb_loop.yaml)
lammps_command: "/home/saitto/active-learning-ML-potential-KTH/codes/interface-lammps-mlip-3/lmp_mpi"
mpi_command:    "mpirun"
mpi_np:         4


# ── Equation of State ──────────────────────────────────────────────────────
# Computes E(V) by uniformly scaling the FCC lattice and fits a
# 3rd-order Birch-Murnaghan EOS to extract V0, E0, B0, B0'.
#
# Pb is soft — use a wider scale range than Fe to capture the full curve.
# Expected B0 ≈ 43 GPa; a poor potential may give <30 or >60 GPa.
eos:
  enabled:    true
  scale_min:  0.80    # wider range needed for soft FCC metal
  scale_max:  1.20
  n_points:   25

  structures:
    - id:          fcc
      # FCC Pb conventional cell (4 atoms), exported by the Materials Project
      # step via materials_project.export_lammps_data = true  →  mp-20483
      lammps_data: structures/Pb_fcc.lammps   # relative to project_root

    # Metastable phases — useful for checking phase-ordering is correct.
    # Comment out if lammps data files are not yet available.
    - id:          bcc
      lammps_data: structures/Pb_bcc.lammps

    - id:          hcp
      lammps_data: structures/Pb_hcp.lammps


# ── Elastic constants ───────────────────────────────────────────────────────
# Six finite-difference strain states → full Cij tensor (Voigt notation).
#
# FCC Pb has only 3 independent elastic constants: C11, C12, C44.
# Voigt averages:
#   B_V = (C11 + 2*C12) / 3        (isotropic limit for cubic)
#   G_V = (C11 - C12 + 3*C44) / 5
#
# Experimental targets (GPa):  C11≈49  C12≈42  C44≈15  B≈43  G≈8
# A delta of 0.005 is gentler than the Fe default (0.01) because Pb
# is mechanically very soft and large strains can cause instabilities.
elastic:
  enabled:    true
  delta:      0.005   # smaller strain for soft metal

  structures:
    - id:          fcc
      lammps_data: structures/Pb_fcc.lammps
